name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  web:
    name: 构建前端
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: 构建 web/dist
        run: make web-build

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 1

  build:
    name: ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: web
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist

      - name: 交叉编译（版本号注入 -X main.version）
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          ./scripts/sync-adapters.sh
          bin=deep-study
          [ "$GOOS" = windows ] && bin=deep-study.exe
          CGO_ENABLED=0 GOOS=$GOOS GOARCH=$GOARCH go build -trimpath \
            -ldflags="-s -w -X main.version=${GITHUB_REF_NAME}" \
            -o "out/$bin" ./server/cmd/server

      - name: 打包归档
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          pkg="deep-study-${GITHUB_REF_NAME}-${GOOS}-${GOARCH}"
          mkdir -p release
          if [ "$GOOS" = windows ]; then
            (cd out && zip -9 "../release/${pkg}.zip" deep-study.exe)
          else
            tar -C out -czf "release/${pkg}.tar.gz" deep-study
          fi
          ls -lh release/

      - name: 上传到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
